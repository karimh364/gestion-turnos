<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cambiar contraseña | Gestión de Turnos</title>
        <link rel="stylesheet" href="css/estilos.css" />
    </head>
    <body>
        <main class="contenedor">
            <section class="tarjeta">
                <h1>Cambiar contraseña</h1>
                <form id="formRestablecer">
                    <label for="nuevaPassword">Nueva contraseña (mínimo 8 caracteres)</label
                    ><input
                        id="nuevaPassword"
                        type="password"
                        minlength="8"
                        maxlength="72"
                        autocomplete="new-password"
                        required
                    /><button type="submit">Guardar contraseña</button>
                </form>
                <p id="mensaje" role="status" aria-live="polite"></p>
                <p><a href="index.html">Ir a iniciar sesión</a></p>
                <p><a href="index.html#recuperar">Solicitar otro enlace</a></p>
            </section>
        </main>
        <script src="js/api.js"></script>
        <script src="js/restablecerPassword.js"></script>
    </body>
</html>
